<!doctype html>
<html class="light" lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DocMind — AI Document Research</title>
    
    <!-- Professional Typography & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Serif:ital,wght@0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />

    <!-- Tailwind Configuration: Restrained, Formal, Professional Palette -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              canvas: "#FAF9F7",
              sidebar: "#F4F3F0",
              "sidebar-hover": "#ECEBE7",
              surface: "#FFFFFF",
              "surface-subtle": "#F7F6F3",
              ink: "#18181B",
              "ink-secondary": "#52525B",
              "ink-tertiary": "#71717A",
              "ink-faint": "#A1A1AA",
              border: "#E4E4E7",
              "border-subtle": "#ECEBE7",
              "border-strong": "#D4D4D8",
              primary: "#0F2942",
              "primary-hover": "#16385C",
              accent: "#1D4ED8",
              "accent-soft": "#EFF6FF",
              success: "#15803D",
              "success-soft": "#F0FDF4",
              danger: "#B91C1C",
              "danger-soft": "#FEF2F2",
            },
            fontFamily: {
              sans: ["Inter", "-apple-system", "BlinkMacSystemFont", "Segoe UI", "Roboto", "sans-serif"],
              serif: ["Noto Serif", "Georgia", "serif"],
              mono: ["JetBrains Mono", "monospace"]
            },
            boxShadow: {
              sm: "0 1px 2px 0 rgba(0, 0, 0, 0.04)",
              dropdown: "0 4px 12px rgba(0, 0, 0, 0.08), 0 1px 3px rgba(0, 0, 0, 0.04)",
              composer: "0 4px 20px -2px rgba(0, 0, 0, 0.06), 0 2px 6px -1px rgba(0, 0, 0, 0.04)",
              drawer: "-4px 0 24px rgba(0, 0, 0, 0.08)",
            }
          }
        }
      };
    </script>
  </head>
  <body class="font-sans antialiased text-[14px] leading-relaxed bg-canvas text-ink overflow-hidden m-0 p-0">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
